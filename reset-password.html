<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Byt lösenord - IDV Admin</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f4f0; color: #1b2d2a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(420px, calc(100% - 32px)); padding: 28px; background: white; border: 1px solid #dfe4dd; border-radius: 16px; box-shadow: 0 12px 30px rgba(24, 31, 28, .08); }
    h1 { margin-top: 0; font-size: 1.5rem; }
    p { color: #5d6e66; line-height: 1.5; }
    label { display: grid; gap: 6px; margin: 16px 0; color: #5d6e66; font-size: .9rem; }
    input { padding: 11px 12px; border: 1px solid #dfe4dd; border-radius: 8px; font: inherit; }
    button { width: 100%; padding: 12px; border: 0; border-radius: 8px; background: #2f6f5a; color: white; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #message { min-height: 1.5em; margin-top: 16px; }
    .error { color: #8d2d2d; }
    .success { color: #28724a; }
  </style>
</head>
<body>
  <main>
    <h1>Byt lösenord</h1>
    <p>Välj ett nytt lösenord för din IDV-administratör.</p>
    <form id="form">
      <label>Publishable key<input id="anonKey" type="password" required autocomplete="off" placeholder="sb_publishable_..."></label>
      <label>Nytt lösenord<input id="password" type="password" minlength="8" required autocomplete="new-password"></label>
      <label>Upprepa lösenord<input id="confirm" type="password" minlength="8" required autocomplete="new-password"></label>
      <button id="submit" type="submit">Spara nytt lösenord</button>
    </form>
    <div id="message" role="status"></div>
  </main>
  <script>
    const projectUrl = 'https://ohwalxqwtxtlldalsclj.supabase.co';
    const hash = new URLSearchParams(location.hash.slice(1));
    const accessToken = hash.get('access_token');
    const form = document.getElementById('form');
    const message = document.getElementById('message');
    const submit = document.getElementById('submit');

    function show(text, type = '') {
      message.textContent = text;
      message.className = type;
    }

    if (!accessToken) {
      form.hidden = true;
      show('Återställningslänken saknar en giltig session. Begär ett nytt mejl.', 'error');
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      if (password !== confirm) return show('Lösenorden matchar inte.', 'error');
      submit.disabled = true;
      show('Sparar...');
      try {
        const anonKey = document.getElementById('anonKey').value.trim();
        const response = await fetch(`${projectUrl}/auth/v1/user`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', apikey: anonKey, Authorization: `Bearer ${accessToken}` },
          body: JSON.stringify({ password })
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(payload.msg || payload.error_description || 'Lösenordet kunde inte ändras.');
        form.hidden = true;
        show('Lösenordet är uppdaterat. Du kan nu stänga sidan och logga in i adminpanelen.', 'success');
      } catch (error) {
        show(error.message, 'error');
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
