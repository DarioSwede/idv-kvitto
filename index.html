<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light only">
<title>Skicka in kvitto — Idrottsveteranerna</title>
<style>html,body{margin:0;background:#faf8f3;color:#1a2e2a;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif}.boot{max-width:640px;margin:0 auto;padding:40px 20px;text-align:center;color:#6b7871}</style>
</head>
<body>
<div class="boot">Laddar kvittoformuläret …</div>
<script>
(async()=>{
  const base=await fetch('app-base.html?v=20260827-2',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Kunde inte ladda formuläret');return r.text()});
  const design=`
/* Designlager 2026-08-27 — svar 2 */
body{max-width:720px;padding:12px 18px 38px;position:relative;overflow-x:hidden}
body::before{content:"";position:fixed;inset:105px 0 0;z-index:0;pointer-events:none;background:url('idv-mark.png') center 110px/390px auto no-repeat;opacity:.045}
.header,main{position:relative;z-index:1}
.header{padding:6px 0 10px;background:rgba(250,248,243,.96);backdrop-filter:blur(10px)}
.logo{display:none!important}
.restart{top:5px;right:0;padding:10px 13px;border-radius:12px;background:rgba(255,255,255,.8);font-size:.82rem}
.timeline{max-width:none;margin:0 88px 0 0;gap:7px;align-items:start}
.seg{height:48px;padding:7px 2px 0;border-top-width:4px;font-size:.73rem;opacity:.42;transition:.18s ease}
.seg:not(:disabled){opacity:1;cursor:pointer}
.seg.active{background:#eef5f0;border-radius:0 0 9px 9px}
.seg.done{background:transparent}
.screen.active{animation:screenIn .18s ease}
@keyframes screenIn{from{opacity:.7;transform:translateY(3px)}to{opacity:1;transform:none}}
.step{margin-top:16px;letter-spacing:.02em}
h1{font-size:clamp(1.8rem,6vw,2.45rem);line-height:1.06;margin:10px 0 12px}
.subtitle{font-size:1.04rem;margin:0 0 15px}
.dropzone{padding:26px 18px;margin:20px 0 12px;border-color:#9db5aa;background:rgba(255,255,255,.68);box-shadow:0 10px 30px rgba(26,46,42,.05)}
.dropzone::before{content:"⇧";display:grid;place-items:center;width:48px;height:48px;margin:0 auto 12px;border:2px solid var(--action);border-radius:16px;color:var(--action);font-size:1.8rem;font-weight:800}
.dropzone strong{font-size:1.12rem;color:var(--ink)}
.dropzone .formats{display:block;margin-top:10px;font-size:.78rem;line-height:1.45;color:var(--muted)}
.upload-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.upload-actions .btn{margin:0;padding:15px 10px;font-size:1rem}
.file-status{display:flex;align-items:center;gap:9px;padding:11px 13px;margin:12px 0;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.6);font-weight:700}
.file-status .count{display:grid;place-items:center;min-width:28px;height:28px;border-radius:50%;background:#e8ece9;color:var(--muted);font-size:.84rem}
.file-status.has-files .count{background:var(--action);color:white}
.info.steps-help{margin:15px 0 10px;padding:15px 16px;background:rgba(238,245,240,.82)}
.info.steps-help strong{font-size:1.05rem}
.info.steps-help ol{margin:10px 0 0;padding-left:1.35rem}
.info.steps-help li{margin:5px 0}
.trust-note{margin:10px 0 14px;padding:11px 13px;text-align:center;border-radius:11px;background:rgba(238,245,240,.72);color:#355a4c;font-size:.9rem}
.bar{padding-top:9px;background:linear-gradient(to bottom,rgba(250,248,243,0),var(--paper) 22%)}
.bar #continue{background:#fff;color:var(--muted);border:2px solid var(--line);transition:.18s ease}
.bar #continue:not(:disabled){background:var(--action);color:white;border-color:var(--action);box-shadow:0 8px 20px rgba(45,106,79,.16)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(142px,1fr));gap:12px}
.receipt-item{width:auto;background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:13px;padding:9px}
.receipt-item .thumb{height:130px}
.receipt-hint{display:none}
@media(max-width:430px){body{padding:10px 14px 32px}.timeline{margin-right:82px;gap:4px}.seg{font-size:.68rem}.restart{font-size:.76rem;padding:9px 11px}.dropzone{padding:22px 12px}.upload-actions{grid-template-columns:1fr 1fr}.upload-actions .btn{font-size:.92rem;padding:14px 6px}.thumbs{grid-template-columns:repeat(2,minmax(0,1fr))}}
`;
  let html=base.replace('</style>',design+'</style>');
  html=html.replace('<img class="logo" src="idv-mark.png" alt="Idrottsveteranerna">','');
  html=html.replace('<button class="restart" id="restart" type="button">Avbryt<br>och börja om</button>','<button class="restart" id="restart" type="button">Avbryt</button>');
  const start=html.indexOf('<section class="screen active" id="upload">');
  const end=html.indexOf('</section>',start)+10;
  const upload=`<section class="screen active" id="upload">
<div class="step">Steg 1 av 5 — Ladda upp kvitton</div>
<h1>Lägg till dina kvitton</h1>
<p class="subtitle">Lägg till ett eller flera kvitton. På dator kan du dra dem direkt till rutan nedan.</p>
<div id="uploadError" aria-live="polite"></div>
<input type="file" id="file" accept=".pdf,.jpg,.jpeg,.png,.heic,.heif,.webp,.avif,image/*,application/pdf" multiple>
<input type="file" id="cameraFile" accept="image/*" capture="environment">
<div class="dropzone" id="dropzone" role="button" tabindex="0" aria-label="Dra och släpp kvittofiler här eller välj filer">
<strong>Dra och släpp kvittofiler här</strong>
<span>eller välj ett av alternativen nedan</span>
<span class="formats">PDF · JPG/JPEG · PNG · HEIC/HEIF · WebP · AVIF &nbsp;•&nbsp; Högst 10 MB per fil</span>
</div>
<div class="upload-actions">
<button class="btn" id="camera" type="button">📷 Ta foto</button>
<button class="btn secondary" id="add" type="button">📁 Välj filer</button>
</div>
<div class="file-status" id="fileStatus"><span class="count" id="fileCount">0</span><span id="fileStatusText">Inga filer tillagda ännu</span></div>
<div class="thumbs" id="thumbs"></div>
<div class="info steps-help"><strong>Så här går det till</strong><ol><li>Lägg till ett eller flera kvitton – ta foto, välj filer eller dra och släpp dem här.</li><li>Dölj eventuella känsliga uppgifter.</li><li>Fyll i namn, belopp och övrig information.</li><li>Kontrollera kvittona och sammanställningen.</li><li>Skicka in.</li></ol></div>
<div class="trust-note">🛡 Dina uppgifter hanteras tryggt och används endast för detta ärende.</div>
<div class="bar"><button class="btn secondary" id="continue" disabled>Fortsätt →</button></div>
</section>`;
  html=html.slice(0,start)+upload+html.slice(end);
  html=html.replace('</body>',`<script>
(function(){
 const f=document.getElementById('file'),cf=document.getElementById('cameraFile'),cam=document.getElementById('camera'),thumbs=document.getElementById('thumbs'),status=document.getElementById('fileStatus'),count=document.getElementById('fileCount'),text=document.getElementById('fileStatusText');
 if(cam&&cf&&f){cam.addEventListener('click',()=>cf.click());cf.addEventListener('change',()=>{if(!cf.files.length)return;try{const dt=new DataTransfer();[...cf.files].forEach(x=>dt.items.add(x));f.files=dt.files;f.dispatchEvent(new Event('change',{bubbles:true}))}catch(e){alert('Kunde inte föra över kamerabilden. Välj fil istället.')}cf.value=''})}
 function sync(){const n=thumbs?thumbs.children.length:0;if(count)count.textContent=String(n);if(text)text.textContent=n===0?'Inga filer tillagda ännu':n===1?'1 fil tillagd':n+' filer tillagda';if(status)status.classList.toggle('has-files',n>0)}
 if(thumbs){new MutationObserver(sync).observe(thumbs,{childList:true});sync()}
})();
<\/script></body>`);
  document.open();document.write(html);document.close();
})().catch(err=>{document.querySelector('.boot').textContent='Kunde inte ladda formuläret. Ladda om sidan.';console.error(err)});
</script>
</body>
</html>
