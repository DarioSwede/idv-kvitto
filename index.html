<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light only">
<title>Skicka in kvitto — Idrottsveteranerna</title>
<style>
html,body{margin:0;background:#faf8f3;color:#1a2e2a;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.boot{max-width:640px;margin:0 auto;padding:40px 20px;text-align:center;color:#6b7871}
</style>
</head>
<body>
<div class="boot">Laddar kvittoformuläret …</div>
<script type="module">
(async()=>{
  try{
    const response=await fetch('version.json',{cache:'no-store'});
    if(!response.ok)throw new Error('Kunde inte läsa versionsinformation');
    const meta=await response.json();
    window.__IDV_VERSION=meta;
    const build=encodeURIComponent(meta.build||meta.version||Date.now());
    await import(`./js/boot.js?v=${build}`);
  }catch(err){
    const bootEl=document.querySelector('.boot');
    if(bootEl)bootEl.textContent='Kunde inte ladda formuläret. Ladda om sidan.';
    console.error(err);
  }
})();
</script>
</body>
</html>
