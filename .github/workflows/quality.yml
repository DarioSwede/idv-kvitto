name: Quality checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          for file in js/*.js tests/*.js playwright.config.js; do
            node --check "$file"
          done

      - name: Validate version metadata
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const m=JSON.parse(fs.readFileSync('version.json','utf8')); if(!/^\\d{4}\\.\\d{2}\\.\\d{2}\\.\\d+$/.test(m.version))throw new Error('Ogiltigt versionsformat: '+m.version); if(!/^\\d{8}-\\d+$/.test(m.build))throw new Error('Ogiltigt build-id: '+m.build); const c=fs.readFileSync('CHANGELOG.md','utf8'); if(!c.includes('## '+m.version))throw new Error('CHANGELOG saknar version '+m.version); console.log('Version metadata OK:',m.version,m.build)"

      - name: Test OCR amount parsing
        run: |
          node --input-type=module -e "const m=await import('./js/receipt-ocr.js'); const cases=[['TOTALT 245,50 kr',245.5],['Att betala 1 234,00',1234],['Moms 2,92\\nTotalt 22,00',22]]; for(const [text,want] of cases){const got=m.findTotalAmount(text);if(got!==want)throw new Error(text+': '+got)} if(!m.shouldRetryOcr({amount:null,suspicious:false}))throw new Error('Tomt OCR-resultat måste köras igen'); if(m.shouldRetryOcr({amount:245.5,suspicious:false}))throw new Error('Säkert OCR-resultat ska inte köras igen'); if(m.calculateOcrScale(1600,1200)!==1.1875)throw new Error('Stora bilder ska inte förstoras minst 1,5x'); console.log('OCR checks: 6/6')"

      - name: Test platform-specific upload help
        run: |
          node --input-type=module -e "const m=await import('./js/upload-ui.js'); const cases=[[{platform:'MacIntel',userAgent:'Macintosh',maxTouchPoints:0},'Hämtade filer'],[{platform:'Win32',userAgent:'Windows'},'Utforskaren'],[{platform:'MacIntel',userAgent:'Macintosh',maxTouchPoints:5},'Kamera'],[{platform:'Linux',userAgent:'Android'},'Kamera']]; for(const [nav,want] of cases){const got=m.getPlatformUploadHelp(nav);if(!got.includes(want))throw new Error(want+': '+got)} if(m.canContinueReceiptStep([''],1,0))throw new Error('Tomt belopp får inte låsa upp nästa steg'); if(!m.canContinueReceiptStep(['125.50'],1,0))throw new Error('Giltigt belopp ska låsa upp nästa steg'); if(m.canContinueReceiptStep(['125.50',''],2,0))throw new Error('Alla kvitton måste ha belopp'); if(m.canContinueReceiptStep(['125.50'],1,1))throw new Error('Pågående filbearbetning måste låsa nästa steg'); console.log('Platform and amount gating: 8/8')"

      - name: Test contact validation
        run: |
          node --input-type=module -e "const m=await import('./js/contact-validation.js'); const valid=[['Tor','tor@example.se'],[' Tor ','tor+idv@example.co.uk']]; const invalid=[['','tor@example.se'],['Tor',''],['Tor','tor@localhost'],['Tor','tor example.se'],['Tor','tor@example.c']]; for(const value of valid){if(!m.hasValidContactDetails(...value))throw new Error('Ska vara giltig: '+value)} for(const value of invalid){if(m.hasValidContactDetails(...value))throw new Error('Ska vara ogiltig: '+value)} console.log('Contact validation: 7/7')"

      - name: Install E2E dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:e2e

      - name: Check patch formatting
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
